<button type="button" onclick="handlePayment()">Pay with Razorpay</button>
{{ payment_config|json_script:"payment-config" }}
<script>
    const paymentConfig = JSON.parse(document.getElementById('payment-config').textContent);
    function handleWebsocket(subscriptionId) {
        const scheme = window.location.protocol === 'http:' ? 'ws:' : 'wss:';
        const ws = new WebSocket(`${scheme}//${window.location.host}/ws/airpay/${encodeURIComponent(subscriptionId)}`);
        ws.onmessage = function (event) {
            const data = JSON.parse(event.data);
            alert(data.status === 'active' ? 'Payment Successful' : 'Payment Failed');
        };
    }
    function handlePayment() {
        const url = new URL(paymentConfig.subscribe_url, window.location.origin);
        for (const key of ['seller_id', 'plan_id', 'gateway', 'buyer']) {
            if (paymentConfig[key]) url.searchParams.set(key, paymentConfig[key]);
        }
        return fetch(url.toString(), {
            method: 'GET',
            headers: {'Content-Type': 'application/json'},
        }).then(response => {
            if (!response.ok) throw new Error('Payment request failed');
            return response.json();
        }).then(result => {
            if (!result.data || !result.data.subscription_id) throw new Error('Subscription unavailable');
            handleWebsocket(result.data.subscription_id);
        }).catch(() => alert('Payment request failed. Please try again.'));
    }
</script>
